[project]
name = "infosiga-fetcher"
version = "0.2.1"
description = "Coletor e conversor Lake Hive de sinistros de trânsito de SP (INFOSIGA)"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["infosiga", "quantilica", "dados-abertos", "lake", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.19.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/infosiga-fetcher"
Repository = "https://github.com/Quantilica/infosiga-fetcher"
Issues = "https://github.com/Quantilica/infosiga-fetcher/issues"

[project.scripts]
infosiga-fetcher = "infosiga_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
infosiga = "infosiga_fetcher.plugin:app"


[project.entry-points."quantilica.lake"]
infosiga = "infosiga_fetcher.lake:converter"


[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "quantilica-core[docs]>=0.19.0",
    "pytest-cov",
    "quantilica-cli>=0.17.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/infosiga_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]

[tool.coverage.run]
source = ["infosiga_fetcher"]

[tool.coverage.report]
# Cobertura abaixo de 80%: relatório informativo (dispensa temporária, ver planning/notes/2026-11-04-ci-pyright-cobertura-dispensas.md).
show_missing = true
skip_covered = true
